<div class="login-container bg-light">
  <div class="login-box">
    <h1 translate>APP_NAME</h1>
    <div>
      <h6 class="d-inline-block">v{{ version }}</h6>
      <div class="d-inline-block ml-3"></div>
    </div>
    <div class="container">
      <div class="card col-md-6 mt-3 mx-auto">
        <div class="card-body">
          <h4 class="card-title text-center">
            <i class="far fa-3x fa-user-circle text-muted"></i>
          </h4>

          <!-- Auth Provider Selector Component -->
          <app-auth-provider-selector
            layout="grid"
            [showDescriptions]="true"
            [showAnonymousWarning]="true"
            [isLoading]="isLoading"
            [loadingProvider]="loadingProvider"
            title=""
            subtitle="You need to be logged in to view requested page. Please choose your preferred login method below."
            (providerSelected)="onProviderSelected($event)"
          >
          </app-auth-provider-selector>
        </div>
      </div>
    </div>
  </div>
</div>
