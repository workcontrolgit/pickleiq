name: 'Deploy to Azure - Secure PickleIQ Infrastructure'

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
        type: choice
        options:
          - dev
          - staging
          - prod

env:
  AZURE_WEBAPP_NAME: pickleiq-app
  NODE_VERSION: '20.x'
  DOTNET_VERSION: '8.0.x'

jobs:
  # Build and test Angular application
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: npm run lint

      - name: Run unit tests
        run: npm run test:ci

      - name: Build Angular application
        run: npm run build

      - name: Upload Angular build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: angular-app
          path: dist/
          retention-days: 1

  # Security scanning
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Snyk security scan
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

      - name: Upload Snyk results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: snyk.sarif

  # Deploy infrastructure to Azure
  deploy-infrastructure:
    runs-on: ubuntu-latest
    needs: [build-frontend, security-scan]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.event_name == 'workflow_dispatch'
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || (github.ref == 'refs/heads/develop' && 'staging' || github.event.inputs.environment) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set environment variables
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "ENVIRONMENT=prod" >> $GITHUB_ENV
            echo "RESOURCE_GROUP=rg-pickleiq-prod" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            echo "ENVIRONMENT=staging" >> $GITHUB_ENV
            echo "RESOURCE_GROUP=rg-pickleiq-staging" >> $GITHUB_ENV
          else
            echo "ENVIRONMENT=${{ github.event.inputs.environment }}" >> $GITHUB_ENV
            echo "RESOURCE_GROUP=rg-pickleiq-${{ github.event.inputs.environment }}" >> $GITHUB_ENV
          fi

      - name: Deploy Azure infrastructure
        run: |
          az deployment group create \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --template-file azure/main.bicep \
            --parameters \
              environment=${{ env.ENVIRONMENT }} \
              azureAdB2CTenantId=${{ secrets.AZURE_AD_B2C_TENANT_ID }} \
            --name "pickleiq-${{ env.ENVIRONMENT }}-$(date +%Y%m%d-%H%M%S)"

      - name: Get deployment outputs
        id: deployment
        run: |
          APP_NAME=$(az deployment group show \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name "pickleiq-${{ env.ENVIRONMENT }}-*" \
            --query "properties.outputs.appServiceName.value" \
            --output tsv | head -1)

          KEY_VAULT_NAME=$(az deployment group show \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name "pickleiq-${{ env.ENVIRONMENT }}-*" \
            --query "properties.outputs.keyVaultName.value" \
            --output tsv | head -1)

          echo "app-name=$APP_NAME" >> $GITHUB_OUTPUT
          echo "key-vault-name=$KEY_VAULT_NAME" >> $GITHUB_OUTPUT

      - name: Update Key Vault secrets
        run: |
          # Only update secrets if they are provided in GitHub secrets
          if [[ -n "${{ secrets.GOOGLE_SHEETS_API_KEY }}" ]]; then
            az keyvault secret set \
              --vault-name ${{ steps.deployment.outputs.key-vault-name }} \
              --name "google-sheets-api-key" \
              --value "${{ secrets.GOOGLE_SHEETS_API_KEY }}"
          fi

          if [[ -n "${{ secrets.YOUTUBE_API_KEY }}" ]]; then
            az keyvault secret set \
              --vault-name ${{ steps.deployment.outputs.key-vault-name }} \
              --name "youtube-api-key" \
              --value "${{ secrets.YOUTUBE_API_KEY }}"
          fi

          if [[ -n "${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID }}" ]]; then
            az keyvault secret set \
              --vault-name ${{ steps.deployment.outputs.key-vault-name }} \
              --name "google-sheets-spreadsheet-id" \
              --value "${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID }}"
          fi

  # Deploy application
  deploy-application:
    runs-on: ubuntu-latest
    needs: [deploy-infrastructure]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || github.event_name == 'workflow_dispatch'
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || (github.ref == 'refs/heads/develop' && 'staging' || github.event.inputs.environment) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Angular build artifacts
        uses: actions/download-artifact@v4
        with:
          name: angular-app
          path: dist/

      - name: Login to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set environment variables
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "ENVIRONMENT=prod" >> $GITHUB_ENV
            echo "RESOURCE_GROUP=rg-pickleiq-prod" >> $GITHUB_ENV
          elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            echo "ENVIRONMENT=staging" >> $GITHUB_ENV
            echo "RESOURCE_GROUP=rg-pickleiq-staging" >> $GITHUB_ENV
          else
            echo "ENVIRONMENT=${{ github.event.inputs.environment }}" >> $GITHUB_ENV
            echo "RESOURCE_GROUP=rg-pickleiq-${{ github.event.inputs.environment }}" >> $GITHUB_ENV
          fi

      - name: Get App Service name
        id: app-service
        run: |
          APP_NAME=$(az deployment group show \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name "pickleiq-${{ env.ENVIRONMENT }}-*" \
            --query "properties.outputs.appServiceName.value" \
            --output tsv | head -1)
          echo "name=$APP_NAME" >> $GITHUB_OUTPUT

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ steps.app-service.outputs.name }}
          package: dist/

      - name: Run post-deployment health check
        run: |
          APP_URL=$(az webapp show \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --name ${{ steps.app-service.outputs.name }} \
            --query "defaultHostName" \
            --output tsv)

          echo "Checking health of https://$APP_URL"

          # Wait for app to start
          sleep 30

          # Health check with retry
          for i in {1..5}; do
            if curl -f -s "https://$APP_URL" > /dev/null; then
              echo "✅ Application is healthy"
              break
            else
              echo "⏳ Attempt $i: Application not ready yet, waiting..."
              sleep 30
            fi
          done

  # Notify deployment status
  notify:
    runs-on: ubuntu-latest
    needs: [deploy-application]
    if: always()
    steps:
      - name: Notify deployment success
        if: needs.deploy-application.result == 'success'
        run: |
          echo "🎉 Deployment to ${{ env.ENVIRONMENT }} completed successfully!"
          echo "🌐 Application is now available"

      - name: Notify deployment failure
        if: needs.deploy-application.result == 'failure'
        run: |
          echo "❌ Deployment to ${{ env.ENVIRONMENT }} failed"
          echo "🔍 Check the logs for more details"
          exit 1
